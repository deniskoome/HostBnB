<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostBnB Admin Panel</title>    
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #007aff;
            --primary-light: color-mix(in srgb, var(--primary-color) 10%, white);
        }
        body {
            min-height: 100vh;
            background: #f9fafb; /* Light grey (gray-50) in light mode */
        }
        .dark body {
            background: #1f2937; /* Dark mode unchanged */
        }
        #top-bar {
            background: var(--primary-color); /* #007aff in light mode */
            color: #ffffff; /* White text */
        }
        .dark #top-bar {
            background: #007aff; /* Dark mode unchanged */
            border-bottom: 1px solid #4b5563;
        }
        #sidebar {
            transition: transform 0.3s ease;
            top: 4rem; /* Below top bar (h-16 = 4rem) */
        }
        #sidebar button {
            transition: background-color 0.3s ease;
        }
        button {
            transition: background-color 0.3s ease;
        }
        #profile-dropdown {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        /* Ensure content doesn’t overlap sidebar/top bar */
        @media (min-width: 768px) {
            #content {
                margin-left: 16rem; /* Matches sidebar w-64 */
                margin-top: 4rem; /* Below top bar */
            }
        }
        /* Center login form */
        #login-form {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Prevent modal overlap */
        #modal {
            z-index: 1000;
        }
        #loading {
            z-index: 1001;
        }
        /* Horizontal scrolling for tables */
        .table-wrapper {
            overflow-x: auto;
            width: 100%;
            padding-bottom: 1rem; /* Space for scrollbar */
            background: #ffffff; /* White in light mode */
        }
        .dark .table-wrapper {
            background: #374151; /* Dark mode unchanged */
        }
        table {
            min-width: 100%;
            width: auto;
        }
        td, th {
            white-space: nowrap; /* Prevent text wrapping */
        }
        /* Dashboard card styles */
        .card {
            background: var(--primary-color); /* #007aff in light mode */
            color: #ffffff; /* White text */
        }
        .dark .card {
            background: #374151; /* Dark mode unchanged */
            color: #d1d5db; /* Gray-200 text */
        }
        /* Table text */
        .table-text {
            color: #000000; /* Black text in light mode */
        }
        .dark .table-text {
            color: #d1d5db; /* Gray-200 in dark mode */
        }
        .dark .text-gray-800 {
            color: #d1d5db;
        }
        .dark .bg-gray-100 {
            background: #4b5563;
        }
        .dark .hover\:bg-gray-50:hover {
            background: #4b5563;
        }
        .dark .text-gray-600 {
            color: #9ca3af;
        }
        .dark .border-gray-300 {
            border-color: #6b7280;
        }
        .dark .text-gray-700 {
            color: #d1d5db;
        }
        /* Table header styles */
        thead {
            background: var(--primary-color);
        }
        thead th {
            color: #ffffff;
        }
        .dark thead {
            background: var(--primary-color);
        }
        .dark thead th {
            color: #ffffff;
        }
        /* Hover styles for table rows */
        tr:hover {
            background: var(--primary-color) !important;
            color: #ffffff !important;
        }
        .dark tr:hover {
            background: var(--primary-color) !important;
            color: #ffffff !important;
        }
        tr:hover .table-text {
            color: #ffffff !important;
        }
        .dark tr:hover .table-text {
            color: #ffffff !important;
        }
        tr:hover select {
            color: #ffffff !important;
        }
        .dark tr:hover select {
            color: #ffffff !important;
        }
        /* Password reveal toggle */
        #password-container {
            position: relative;
        }
        #password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        /* Fix page title color in light mode */
        h2 {
            color: #000000 !important; /* Black text in light mode */
        }
        .dark h2 {
            color: #ffffff !important; /* White text in dark mode */
        }
        /* Search bar styling */
        #search-users,
        #search-listings,
        #search-bookings,
        #search-user_reports,
        #search-wallet,
        #search-wallet_transactions,
        #search-notifications {
            background: #ffffff !important; /* White background in light mode */
            color: #1f2937 !important; /* Dark gray text in light mode (text-gray-800) */
        }
        .dark #search-users,
        .dark #search-listings,
        .dark #search-bookings,
        .dark #search-user_reports,
        .dark #search-wallet,
        .dark #search-wallet_transactions,
        .dark #search-notifications {
            background: #374151 !important; /* Dark mode background */
            color: #d1d5db !important; /* Light gray text in dark mode (text-gray-200) */
        }
        #search-users::placeholder,
        #search-listings::placeholder,
        #search-bookings::placeholder,
        #search-user_reports::placeholder,
        #search-wallet::placeholder,
        #search-wallet_transactions::placeholder,
        #search-notifications::placeholder {
            color: #6b7280 !important; /* Gray-500 for placeholder in light mode */
        }
        .dark #search-users::placeholder,
        .dark #search-listings::placeholder,
        .dark #search-bookings::placeholder,
        .dark #search-user_reports::placeholder,
        .dark #search-wallet::placeholder,
        .dark #search-wallet_transactions::placeholder,
        .dark #search-notifications::placeholder {
            color: #9ca3af !important; /* Gray-400 for placeholder in dark mode */
        }
        /* Circular profile avatar */
        .profile-avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e5e7eb; /* Light grey background for avatar */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #374151; /* Dark text for initials */
            text-transform: uppercase;
            border: 2px solid #007aff; /* Matches --primary-color */
        }
        .dark .profile-avatar {
            background: #4b5563; /* Dark mode avatar background */
            color: #d1d5db; /* Light text for initials */
            border: 2px solid #007aff;
        }
        .profile-avatar:hover {
            background: #d1d5db; /* Slightly darker in light mode */
            cursor: pointer;
        }
        .dark .profile-avatar:hover {
            background: #6b7280; /* Slightly lighter in dark mode */
        }
    </style>
</head>
<body class="font-sans text-gray-800">
    <div id="top-bar" class="fixed top-0 left-0 w-full h-16 flex items-center justify-between px-6 z-50 hidden">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-white">HostBnB</h1>
            <button id="dark-mode-toggle" class="p-2 rounded-md hover:bg-[#005bb5]">
                <svg id="dark-mode-icon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </button>
        </div>
        <div id="profile-section" class="hidden flex items-center space-x-2">
            <span id="greeting" class="text-lg font-medium text-white">Hi, Admin</span>
            <div class="relative">
                <button id="profile-toggle" class="flex items-center">
                    <div class="profile-avatar">A</div>
                </button>
                <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-700 rounded-lg shadow-lg py-2 z-50">
                    <button id="logout-button" class="w-full text-left px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-blue-100 dark:hover:bg-blue-900">Logout</button>
                </div>
            </div>
        </div>
    </div>
    <div id="login-form" class="w-full max-w-md p-8 bg-[var(--primary-color)] rounded-lg shadow-lg text-white">
        <h2 class="text-2xl font-bold text-center mb-6">HostBnB Admin Login</h2>
        <input type="email" id="email" placeholder="Email" required class="w-full p-3 mb-4 border border-white rounded-md focus:outline-none focus:ring-2 focus:ring-white bg-white text-[var(--primary-color)] placeholder-gray-500">
        <div id="password-container" class="relative mb-4">
            <input type="password" id="password" placeholder="Password" required class="w-full p-3 border border-white rounded-md focus:outline-none focus:ring-2 focus:ring-white bg-white text-[var(--primary-color)] placeholder-gray-500">
            <span id="password-toggle" class="text-gray-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </span>
        </div>
        <button id="login-button" class="w-full p-3 bg-white text-[var(--primary-color)] rounded-md hover:bg-gray-200">Login</button>
    </div>
    <div id="admin-panel" class="hidden w-full flex">
        <button id="sidebar-toggle" class="md:hidden fixed top-20 left-4 z-50 p-2 bg-[var(--primary-color)] text-white rounded-md">☰</button>
        <div id="sidebar" class="fixed left-0 w-64 h-full bg-gray-800 text-white p-6 shadow-lg md:translate-x-0 -translate-x-64">
            <button id="nav-sidebar-dashboard" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Dashboard</button>
            <button id="nav-sidebar-users" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Users</button>
            <button id="nav-sidebar-listings" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Listings</button>
            <button id="nav-sidebar-bookings" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Bookings</button>
            <button id="nav-sidebar-user_reports" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">User Reports</button>
            <button id="nav-sidebar-wallet" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Wallets</button>
            <button id="nav-sidebar-wallet_transactions" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Wallet Transactions</button>
            <button id="nav-sidebar-notifications" class="w-full p-3 text-left rounded-md hover:bg-gray-700 mb-2">Notifications</button>
        </div>
        <div id="content" class="flex-1 p-8 w-full"></div>
    </div>
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-[var(--primary-color)] dark:bg-gray-700 p-8 rounded-lg max-w-2xl w-full max-h-[80vh] overflow-y-auto shadow-lg text-white dark:text-gray-200">
            <span class="float-right cursor-pointer text-2xl">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>
    <div id="loading" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-[var(--primary-color)] dark:bg-gray-700 p-6 rounded-lg shadow-lg text-white">Loading...</div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM fully loaded');

            // Initialize Supabase
            if (typeof window.supabase === 'undefined') {
                console.error('Supabase library failed to load from CDN.');
                alert('Failed to load Supabase library.');
                return;
            }

            const supabaseUrl = 'https://lczghvmebxdsjxpepcto.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxjemdodm1lYnhkc2p4cGVwY3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5NjcyNzQsImV4cCI6MjA2OTU0MzI3NH0.zcWBX-EngAOJsFXPplKSGJhKcVgf6FfhEGkV2qzd9hk';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            if (!supabase) {
                console.error('Supabase client initialization failed.');
                alert('Failed to initialize Supabase client.');
                return;
            }
            console.log('Supabase client initialized successfully');

            // Dark mode toggle
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            const darkModeIcon = document.getElementById('dark-mode-icon');
            const isDarkMode = localStorage.getItem('dark-mode') === 'true';
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                darkModeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
            }
            darkModeToggle.addEventListener('click', () => {
                console.log('Dark mode toggle clicked');
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                darkModeIcon.innerHTML = isDark
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>'
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
                localStorage.setItem('dark-mode', isDark);
            });

            // Password reveal toggle
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('password-toggle');
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                passwordToggle.innerHTML = type === 'password' ?
                    '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>' :
                    '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0111.25 19c-2.975 0-5.65-1.3-7.5-3.375m-1.5-1.05A9.954 9.954 0 013 12c0-1.25.225-2.45.638-3.562M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7m-1.5 1.05A9.954 9.954 0 0021 12c0 1.25-.225 2.45-.638 3.562M21.542 12C20.268 16.057 16.478 19 12 19c-4.478 0-8.268-2.943-9.542-7" /></svg>';
            });

            // Attach login button event listener
            const loginButton = document.getElementById('login-button');
            if (loginButton) {
                console.log('Login button found, attaching event listener');
                loginButton.addEventListener('click', async () => {
                    console.log('Login button clicked');
                    try {
                        await login();
                    } catch (error) {
                        console.error('Unexpected error in login:', error);
                        alert('An unexpected error occurred during login.');
                        showLoading(false);
                    }
                });
            } else {
                console.error('Login button not found in DOM');
                alert('Login button not found.');
            }

            // Attach sidebar button event listeners
            const sections = [
                { id: 'nav-sidebar-dashboard', handler: showDashboard },
                { id: 'nav-sidebar-users', handler: () => showSection('users') },
                { id: 'nav-sidebar-listings', handler: () => showSection('listings') },
                { id: 'nav-sidebar-bookings', handler: () => showSection('bookings') },
                { id: 'nav-sidebar-user_reports', handler: () => showSection('user_reports') },
                { id: 'nav-sidebar-wallet', handler: () => showSection('wallet') },
                { id: 'nav-sidebar-wallet_transactions', handler: () => showSection('wallet_transactions') },
                { id: 'nav-sidebar-notifications', handler: () => showSection('notifications') }
            ];

            sections.forEach(({ id, handler }) => {
                const button = document.getElementById(id);
                if (button) {
                    console.log(`Attaching click event listener to ${id}`);
                    button.addEventListener('click', () => {
                        console.log(`Button ${id} clicked`);
                        try {
                            handler();
                        } catch (error) {
                            console.error(`Error in ${id} handler:`, error);
                            alert(`Failed to load ${id.replace('nav-sidebar-', '')}: ${error.message}`);
                        }
                    });
                } else {
                    console.error(`Button ${id} not found in DOM`);
                    alert(`Button ${id} not found. Please check the HTML structure.`);
                }
            });

            // Attach sidebar toggle
            const sidebarToggle = document.getElementById('sidebar-toggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    console.log('Sidebar toggle clicked');
                    toggleSidebar();
                });
            }

            // Attach profile dropdown toggle
            const profileToggle = document.getElementById('profile-toggle');
            if (profileToggle) {
                profileToggle.addEventListener('click', () => {
                    console.log('Profile toggle clicked');
                    toggleProfileDropdown();
                });
            }

            // Attach logout button
            const logoutButton = document.getElementById('logout-button');
            if (logoutButton) {
                logoutButton.addEventListener('click', async () => {
                    console.log('Logout button clicked');
                    await logout();
                });
            }

            // Attach modal close
            document.querySelector('#modal .float-right').addEventListener('click', closeModal);

            // Event delegation for dynamic buttons
            document.addEventListener('click', (e) => {
                if (e.target.matches('[data-action="edit"]')) {
                    console.log('Edit button clicked');
                    const table = e.target.dataset.table;
                    const id = e.target.dataset.id;
                    openEditModal(table, id);
                } else if (e.target.matches('[data-action="delete"]')) {
                    console.log('Delete button clicked');
                    const table = e.target.dataset.table;
                    const id = e.target.dataset.id;
                    deleteItem(table, id);
                } else if (e.target.matches('[data-action="approve-cancellation"]')) {
                    console.log('Approve cancellation button clicked');
                    const id = e.target.dataset.id;
                    approveCancellation(id);
                } else if (e.target.matches('[data-action="mark-read"]')) {
                    console.log('Mark read button clicked');
                    const id = e.target.dataset.id;
                    const isRead = e.target.dataset.isRead === 'true';
                    markRead(id, !isRead);
                } else if (e.target.matches('[data-action="adjust-balance"]')) {
                    console.log('Adjust balance button clicked');
                    const id = e.target.dataset.id;
                    const email = e.target.dataset.email;
                    adjustBalance(id, email);
                } else if (e.target.matches('[data-action="add-item"]')) {
                    console.log('Add item button clicked');
                    const table = e.target.dataset.table;
                    addItem(table);
                } else if (e.target.matches('[data-action="update-item"]')) {
                    console.log('Update item button clicked');
                    const table = e.target.dataset.table;
                    const id = e.target.dataset.id;
                    updateItem(table, id);
                } else if (e.target.matches('[data-action="discard-modal"]')) {
                    console.log('Discard modal button clicked');
                    closeModal();
                }
            });

            document.addEventListener('change', (e) => {
                if (e.target.matches('[data-action="update-status"]')) {
                    console.log('Update status changed');
                    const id = e.target.dataset.id;
                    const status = e.target.value;
                    updateStatus(id, status);
                }
            });

            let currentPage = 1;
            const itemsPerPage = 10;
            let currentData = [];
            let currentSection = '';

            function setActiveNav(section) {
                console.log(`Setting active nav for section: ${section}`);
                document.querySelectorAll('#sidebar button').forEach(el => el.classList.remove('bg-[var(--primary-color)]'));
                const sidebarBtn = document.getElementById(`nav-sidebar-${section}`);
                if (sidebarBtn) sidebarBtn.classList.add('bg-[var(--primary-color)]');
                else console.error(`Sidebar button for ${section} not found`);
            }

            async function login() {
                console.log('login() function called');
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                emailInput.classList.remove('border-red-500');
                passwordInput.classList.remove('border-red-500');
                if (!email || !password) {
                    emailInput.classList.add('border-red-500');
                    passwordInput.classList.add('border-red-500');
                    return alert('Email and password are required');
                }
                showLoading(true);
                console.log('Attempting login with email:', email);
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    console.error('Login error:', error);
                    showLoading(false);
                    return alert(`Login failed: ${error.message}`);
                }
                console.log('Login successful, checking admin role...');
                const user = await checkAdminRole(email);
                if (user && user.role === 'admin') {
                    console.log('Admin role confirmed:', user);
                    currentUser = user;
                    document.getElementById('greeting').textContent = `Hi, ${user.first_name || 'Admin'}`;
                    const profileAvatar = document.querySelector('.profile-avatar');
                    profileAvatar.textContent = user.first_name ? user.first_name[0].toUpperCase() : 'A';
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('profile-section').classList.remove('hidden');
                    document.getElementById('content').classList.remove('ml-0');
                    document.getElementById('top-bar').classList.remove('hidden');
                    showDashboard();
                } else {
                    console.log('Not an admin or user not found:', user);
                    alert('Access denied: Admin role required');
                    await logout();
                }
                showLoading(false);
            }

            async function checkAdminRole(email) {
                try {
                    console.log('Checking admin role for email:', email);
                    const { data, error } = await supabase.from('users').select('*').eq('email', email).single();
                    if (error) {
                        console.error('Error checking admin role:', error);
                        alert(`Error checking role: ${error.message}.`);
                        return null;
                    }
                    console.log('Admin role check result:', data);
                    return data;
                } catch (error) {
                    console.error('Unexpected error in checkAdminRole:', error);
                    alert('Failed to verify admin role.');
                    return null;
                }
            }

            async function logout() {
                console.log('logout() function called');
                showLoading(true);
                try {
                    await supabase.auth.signOut();
                } catch (error) {
                    console.error('Logout error:', error);
                }
                document.getElementById('admin-panel').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('profile-section').classList.add('hidden');
                document.getElementById('content').classList.add('ml-0');
                document.getElementById('sidebar').classList.remove('show');
                document.getElementById('top-bar').classList.add('hidden');
                setActiveNav('');
                currentUser = null;
                const profileAvatar = document.querySelector('.profile-avatar');
                profileAvatar.textContent = 'A';
                showLoading(false);
            }

            function showLoading(show) {
                console.log('showLoading called with:', show);
                document.getElementById('loading').classList.toggle('hidden', !show);
            }

            function toggleSidebar() {
                console.log('Toggling sidebar');
                const sidebar = document.getElementById('sidebar');
                const content = document.getElementById('content');
                sidebar.classList.toggle('show');
                content.classList.toggle('ml-0');
            }

            function toggleProfileDropdown() {
                console.log('Toggling profile dropdown');
                const dropdown = document.getElementById('profile-dropdown');
                dropdown.classList.toggle('hidden');
            }

            async function showDashboard() {
                console.log('showDashboard called');
                currentSection = 'dashboard';
                setActiveNav('dashboard');
                showLoading(true);
                const content = document.getElementById('content');
                content.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">Dashboard</h2>
                    <div id="metrics" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                `;
                await updateMetrics();
                subscribeToDashboard();
                showLoading(false);
            }

            async function updateMetrics() {
                try {
                    console.log('Updating dashboard metrics');
                    const [listings, activeBookings, users, pendingReports, wallets] = await Promise.all([
                        supabase.from('listings').select('count', { count: 'exact', head: true }),
                        supabase.from('bookings').select('count', { count: 'exact', head: true }).eq('active', true),
                        supabase.from('users').select('count', { count: 'exact', head: true }),
                        supabase.from('user_reports').select('count', { count: 'exact', head: true }).eq('status', 'pending'),
                        supabase.from('wallet').select('balance')
                    ]);
                    const totalBalance = wallets.data ? wallets.data.reduce((sum, w) => sum + (w.balance || 0), 0) : 0;
                    document.getElementById('metrics').innerHTML = `
                        <div class="card p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                            <p class="text-lg font-semibold">Total Listings</p>
                            <p class="text-2xl">${(listings.count || 0).toLocaleString()}</p>
                        </div>
                        <div class="card p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                            <p class="text-lg font-semibold">Active Bookings</p>
                            <p class="text-2xl">${(activeBookings.count || 0).toLocaleString()}</p>
                        </div>
                        <div class="card p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                            <p class="text-lg font-semibold">Total Users</p>
                            <p class="text-2xl">${(users.count || 0).toLocaleString()}</p>
                        </div>
                        <div class="card p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                            <p class="text-lg font-semibold">Pending Reports</p>
                            <p class="text-2xl">${(pendingReports.count || 0).toLocaleString()}</p>
                        </div>
                        <div class="card p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                            <p class="text-lg font-semibold">Total Wallet Balance</p>
                            <p class="text-2xl">Ksh ${totalBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
                        </div>
                    `;
                } catch (error) {
                    console.error('Error updating metrics:', error);
                    alert('Failed to load dashboard metrics: ' + error.message);
                }
            }

            function subscribeToDashboard() {
                console.log('Subscribing to dashboard updates');
                const tables = ['listings', 'bookings', 'users', 'user_reports', 'wallet'];
                tables.forEach(table => {
                    supabase.channel(`dashboard-${table}`).on('postgres_changes', { event: '*', schema: 'public', table }, () => {
                        if (currentSection === 'dashboard') updateMetrics();
                    }).subscribe();
                });
            }

            async function showSection(table) {
                console.log(`showSection called for table: ${table}`);
                currentSection = table;
                setActiveNav(table);
                showLoading(true);
                const content = document.getElementById('content');
                content.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">${formatTitle(table)}</h2>
                    <div class="flex flex-col sm:flex-row gap-4 mb-6">
                        <input type="text" id="search-${table}" placeholder="Search..." class="p-3 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]">
                        <button id="add-${table}" class="p-3 bg-[var(--primary-color)] text-white rounded-md hover:bg-[#005bb5]">Add New</button>
                        <button id="export-${table}" class="p-3 bg-gray-500 text-white rounded-md hover:bg-gray-600">Export to CSV</button>
                    </div>
                    <div class="table-wrapper rounded-lg shadow-lg overflow-x-auto">
                        <table id="${table}-table" class="min-w-full w-auto">
                            <thead class="bg-[var(--primary-color)]"></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="pagination flex gap-2 mt-4 justify-center" id="pagination-${table}"></div>
                `;
                // Attach event listeners for Add, Export, and Search
                document.getElementById(`add-${table}`).addEventListener('click', () => {
                    console.log(`Add button clicked for ${table}`);
                    openAddModal(table);
                });
                document.getElementById(`export-${table}`).addEventListener('click', () => {
                    console.log(`Export button clicked for ${table}`);
                    exportToCSV(table);
                });
                const searchInput = document.getElementById(`search-${table}`);
                searchInput.addEventListener('input', debounce(() => filterAndPaginate(table), 300));
                try {
                    console.log(`Verifying table existence: ${table}`);
                    const { data: tableCheck } = await supabase.from(table).select('id').limit(1);
                    console.log(`Table ${table} exists, fetching data`);
                    const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                    if (error) {
                        console.error(`Error fetching ${table}:`, error);
                        alert(`Failed to load ${table}: ${error.message}.`);
                        content.innerHTML += `<p class="text-red-500 mt-4 text-center">Error: ${error.message}</p>`;
                        showLoading(false);
                        return;
                    }
                    console.log(`Data fetched for ${table}:`, data);
                    currentData = data || [];
                    if (currentData.length === 0) {
                        console.log(`No data found for ${table}`);
                        content.innerHTML += `<p class="text-gray-600 dark:text-gray-400 mt-4 text-center">No data available in ${table} table.</p>`;
                    }
                    renderTable(table, currentData);
                    filterAndPaginate(table);
                    subscribeToTable(table);
                } catch (error) {
                    console.error(`Unexpected error in showSection for ${table}:`, error);
                    alert(`Unexpected error loading ${table}: ${error.message}`);
                    content.innerHTML += `<p class="text-red-500 mt-4 text-center">Unexpected error: ${error.message}</p>`;
                }
                showLoading(false);
            }

            function formatTitle(str) {
                return str.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            }

            function renderTable(table, data) {
                console.log(`Rendering table for ${table}, data length: ${data.length}`);
                const thead = document.querySelector(`#${table}-table thead`);
                const tbody = document.querySelector(`#${table}-table tbody`);
                thead.innerHTML = '';
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="100" class="p-4 text-center text-gray-600 dark:text-gray-400">No data available</td></tr>';
                    renderPagination(table, 0);
                    return;
                }
                let headers = Object.keys(data[0]).filter(h => h !== 'created_at' && h !== 'updated_at');
                if (table === 'listings') {
                    const ordered = ['id', 'email', 'unit_type'];
                    const rest = headers.filter(h => !ordered.includes(h));
                    headers = [...ordered, ...rest];
                }
                const tr = document.createElement('tr');
                headers.forEach(h => {
                    const th = document.createElement('th');
                    th.className = 'p-4 text-left font-semibold';
                    th.textContent = formatTitle(h);
                    tr.appendChild(th);
                });
                tr.innerHTML += '<th class="p-4 text-left font-semibold">Actions</th>';
                thead.appendChild(tr);
                const start = (currentPage - 1) * itemsPerPage;
                const end = start + itemsPerPage;
                const paginatedData = data.slice(start, end);
                paginatedData.forEach(row => {
                    const tr = document.createElement('tr');
                    headers.forEach(h => {
                        const td = document.createElement('td');
                        td.className = 'p-4 table-text';
                        if (h === 'image_urls' && table === 'listings') {
                            let urls = [];
                            if (Array.isArray(row[h])) {
                                urls = row[h];
                            } else if (typeof row[h] === 'string') {
                                urls = row[h].split(',');
                            }
                            td.innerHTML = urls.length ? urls.map(url => `<img src="${url.trim()}" width="50" alt="image" class="inline-block m-1 rounded">`).join('') : '';
                        } else {
                            td.textContent = row[h] !== null && row[h] !== undefined ? row[h] : '';
                        }
                        tr.appendChild(td);
                    });
                    const actions = document.createElement('td');
                    actions.className = 'p-4 flex gap-2';
                    let actionsHtml = '';
                    if (table !== 'wallet' && table !== 'user_reports') {
                        actionsHtml += `<button data-action="edit" data-table="${table}" data-id="${row.id}" class="p-2 bg-white text-[var(--primary-color)] rounded-md hover:bg-gray-200">Edit</button>`;
                    }
                    if (table === 'bookings' && row.cancellation_requested_at && !row.approve_cancellation) {
                        actionsHtml += `<button data-action="approve-cancellation" data-id="${row.id}" class="p-2 bg-[var(--primary-color)] text-white rounded-md hover:bg-[#005bb5]">Approve Cancellation</button>`;
                    }
                    if (table === 'user_reports') {
                        actionsHtml += `
                            <select data-action="update-status" data-id="${row.id}" class="p-2 border border-gray-300 dark:border-gray-600 rounded-md text-[var(--primary-color)] dark:text-gray-200">
                                <option value="${row.status}" selected disabled>${row.status}</option>
                                <option value="pending">Pending</option>
                                <option value="resolved">Resolved</option>
                            </select>
                        `;
                    }
                    if (table === 'wallet') {
                        actionsHtml += `<button data-action="adjust-balance" data-id="${row.id || row.email}" data-email="${row.email}" class="p-2 bg-[var(--primary-color)] text-white rounded-md hover:bg-[#005bb5]">Adjust Balance</button>`;
                    }
                    actionsHtml += `<button data-action="delete" data-table="${table}" data-id="${row.id || row.email}" class="p-2 bg-red-500 text-white rounded-md hover:bg-red-600">Delete</button>`;
                    actions.innerHTML = actionsHtml;
                    tr.appendChild(actions);
                    tbody.appendChild(tr);
                });
                renderPagination(table, data.length);
            }

            function filterAndPaginate(table) {
                currentPage = 1;
                const searchInput = document.getElementById(`search-${table}`);
                const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
                const filteredData = currentData.filter(row => {
                    return Object.values(row).some(val => {
                        if (val !== null && val !== undefined) {
                            let strVal = '';
                            if (Array.isArray(val)) {
                                strVal = val.join(' ');
                            } else if (typeof val === 'object') {
                                strVal = JSON.stringify(val);
                            } else {
                                strVal = val.toString();
                            }
                            return strVal.toLowerCase().includes(searchTerm);
                        }
                        return false;
                    });
                });
                renderTable(table, filteredData);
            }

            function renderPagination(table, totalItems) {
                const pagination = document.getElementById(`pagination-${table}`);
                pagination.innerHTML = '';
                const totalPages = Math.ceil(totalItems / itemsPerPage);
                if (totalPages <= 1) return;
                for (let i = 1; i <= totalPages; i++) {
                    const button = document.createElement('button');
                    button.textContent = i;
                    button.className = `p-2 rounded-md ${i === currentPage ? 'bg-[var(--primary-color)] text-white' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}`;
                    button.addEventListener('click', () => {
                        currentPage = i;
                        filterAndPaginate(table);
                    });
                    pagination.appendChild(button);
                }
            }

            function debounce(func, delay) {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => func(...args), delay);
                };
            }

            function subscribeToTable(table) {
                console.log(`Subscribing to ${table} updates`);
                supabase.channel(table).on('postgres_changes', { event: '*', schema: 'public', table }, () => {
                    if (currentSection === table) showSection(table);
                }).subscribe();
            }

            function openEditModal(table, id) {
                console.log(`Opening edit modal for ${table} id ${id}`);
                const row = currentData.find(r => r.id === id || r.email === id);
                if (!row) return alert('Item not found');
                let formHtml = '';
                Object.keys(row).forEach(key => {
                    if (key !== 'id' && key !== 'created_at' && key !== 'updated_at') {
                        const value = Array.isArray(row[key]) ? row[key].join(',') : row[key] || '';
                        formHtml += `
                            <div class="mb-4">
                                <label class="block mb-2">${formatTitle(key)}</label>
                                <input type="${key.includes('password') ? 'password' : 'text'}" id="edit-${key}" value="${value}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200">
                            </div>
                        `;
                    }
                });
                document.getElementById('modal-body').innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Edit ${formatTitle(table)}</h2>
                    ${formHtml}
                    <div class="flex gap-2">
                        <button data-action="update-item" data-table="${table}" data-id="${id}" class="flex-1 p-3 bg-[var(--primary-color)] text-white rounded-md hover:bg-[#005bb5]">Update</button>
                        <button data-action="discard-modal" class="flex-1 p-3 bg-red-500 text-white rounded-md hover:bg-red-600">Discard</button>
                    </div>
                `;
                document.getElementById('modal').classList.remove('hidden');
            }

            function openAddModal(table) {
                console.log(`Opening add modal for ${table}`);
                let formHtml = '';
                const fields = getTableFields(table);
                fields.forEach(field => {
                    formHtml += `
                        <div class="mb-4">
                            <label class="block mb-2">${formatTitle(field)}</label>
                            <input type="${field.includes('password') ? 'password' : field.includes('email') ? 'email' : 'text'}" id="add-${field}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200">
                        </div>
                    `;
                });
                document.getElementById('modal-body').innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Add New ${formatTitle(table)}</h2>
                    ${formHtml}
                    <div class="flex gap-2">
                        <button data-action="add-item" data-table="${table}" class="flex-1 p-3 bg-[var(--primary-color)] text-white rounded-md hover:bg-[#005bb5]">Add</button>
                        <button data-action="discard-modal" class="flex-1 p-3 bg-red-500 text-white rounded-md hover:bg-red-600">Discard</button>
                    </div>
                `;
                document.getElementById('modal').classList.remove('hidden');
            }

            function getTableFields(table) {
                const fieldsMap = {
                    users: ['email', 'first_name', 'last_name', 'role'],
                    listings: ['email', 'unit_type', 'title', 'description'],
                    bookings: ['listing_id', 'guest_email', 'start_date', 'end_date'],
                    user_reports: ['reporter_email', 'reported_email', 'reason'],
                    wallet: ['email', 'balance'],
                    wallet_transactions: ['wallet_id', 'amount', 'type'],
                    notifications: ['user_email', 'message']
                };
                return fieldsMap[table] || [];
            }

            async function addItem(table) {
                console.log(`Adding item to ${table}`);
                showLoading(true);
                try {
                    const fields = getTableFields(table);
                    const newItem = {};
                    fields.forEach(field => {
                        const input = document.getElementById(`add-${field}`);
                        let value = input.value.trim();
                        if (field === 'image_urls') {
                            value = value.split(',').map(u => u.trim());
                        }
                        newItem[field] = value;
                    });
                    const { error } = await supabase.from(table).insert([newItem]);
                    if (error) {
                        console.error(`Error adding to ${table}:`, error);
                        throw new Error(error.message);
                    }
                    closeModal();
                    showSection(table);
                } catch (error) {
                    alert(`Failed to add item: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function updateItem(table, id) {
                console.log(`Updating item in ${table} id ${id}`);
                showLoading(true);
                try {
                    const updates = {};
                    const row = currentData.find(r => r.id === id || r.email === id);
                    Object.keys(row).forEach(key => {
                        if (key !== 'id' && key !== 'created_at' && key !== 'updated_at') {
                            const input = document.getElementById(`edit-${key}`);
                            if (input) {
                                let value = input.value;
                                if (key === 'image_urls') {
                                    value = value.split(',').map(u => u.trim());
                                }
                                updates[key] = value;
                            }
                        }
                    });
                    let query = supabase.from(table).update(updates);
                    if (table === 'wallet') {
                        query = query.eq('email', id);
                    } else {
                        query = query.eq('id', id);
                    }
                    const { error } = await query;
                    if (error) {
                        console.error(`Error updating ${table}:`, error);
                        throw new Error(error.message);
                    }
                    closeModal();
                    showSection(table);
                } catch (error) {
                    alert(`Failed to update item: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function deleteItem(table, id) {
                if (!confirm('Are you sure you want to delete this item?')) return;
                console.log(`Deleting item from ${table} id ${id}`);
                showLoading(true);
                try {
                    let query = supabase.from(table).delete();
                    if (table === 'wallet') {
                        query = query.eq('email', id);
                    } else {
                        query = query.eq('id', id);
                    }
                    const { error } = await query;
                    if (error) {
                        console.error(`Error deleting from ${table}:`, error);
                        throw new Error(error.message);
                    }
                    showSection(table);
                } catch (error) {
                    alert(`Failed to delete item: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function approveCancellation(id) {
                console.log(`Approving cancellation for booking id ${id}`);
                showLoading(true);
                try {
                    const { error } = await supabase.from('bookings').update({ approve_cancellation: true }).eq('id', id);
                    if (error) {
                        console.error('Error approving cancellation:', error);
                        throw new Error(error.message);
                    }
                    showSection('bookings');
                } catch (error) {
                    alert(`Failed to approve cancellation: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function markRead(id, isRead) {
                console.log(`Marking notification ${id} as ${isRead ? 'read' : 'unread'}`);
                showLoading(true);
                try {
                    const { error } = await supabase.from('notifications').update({ is_read: isRead }).eq('id', id);
                    if (error) {
                        console.error('Error marking read:', error);
                        throw new Error(error.message);
                    }
                    showSection('notifications');
                } catch (error) {
                    alert(`Failed to mark as read: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function adjustBalance(id, email) {
                const amount = prompt('Enter amount to adjust (positive to add, negative to subtract):');
                if (!amount || isNaN(amount)) return alert('Invalid amount');
                console.log(`Adjusting balance for wallet ${id} by ${amount}`);
                showLoading(true);
                try {
                    const parsedAmount = parseFloat(amount);
                    const { data: current } = await supabase.from('wallet').select('balance').eq('email', email).single();
                    const newBalance = (current ? current.balance : 0) + parsedAmount;
                    const { error: updateError } = await supabase.from('wallet').update({ balance: newBalance }).eq('email', email);
                    if (updateError) {
                        console.error('Error adjusting balance:', updateError);
                        throw new Error(updateError.message);
                    }
                    showSection('wallet');
                } catch (error) {
                    alert(`Failed to adjust balance: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function updateStatus(id, status) {
                console.log(`Updating status for report ${id} to ${status}`);
                showLoading(true);
                try {
                    const { error } = await supabase.from('user_reports').update({ status }).eq('id', id);
                    if (error) {
                        console.error('Error updating status:', error);
                        throw new Error(error.message);
                    }
                    showSection('user_reports');
                } catch (error) {
                    alert(`Failed to update status: ${error.message}`);
                } finally {
                    showLoading(false);
                }
            }

            function closeModal() {
                document.getElementById('modal').classList.add('hidden');
                document.getElementById('modal-body').innerHTML = '';
            }

            function exportToCSV(table) {
                console.log(`Exporting ${table} to CSV`);
                if (currentData.length === 0) {
                    alert('No data to export');
                    return;
                }
                const csv = [
                    Object.keys(currentData[0]).join(','),
                    ...currentData.map(row => Object.values(row).map(val => {
                        if (Array.isArray(val)) {
                            val = val.map(v => String(v).replace(/"/g, '""')).join(';');
                        } else {
                            val = val !== null && val !== undefined ? String(val).replace(/"/g, '""') : '';
                        }
                        return `"${val}"`;
                    }).join(','))
                ].join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${table}.csv`;
                link.click();
            }

            // Check for existing session
            async function checkSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    const user = await checkAdminRole(session.user.email);
                    if (user && user.role === 'admin') {
                        currentUser = user;
                        document.getElementById('greeting').textContent = `Hi, ${user.first_name || 'Admin'}`;
                        const profileAvatar = document.querySelector('.profile-avatar');
                        profileAvatar.textContent = user.first_name ? user.first_name[0].toUpperCase() : 'A';
                        document.getElementById('login-form').classList.add('hidden');
                        document.getElementById('admin-panel').classList.remove('hidden');
                        document.getElementById('profile-section').classList.remove('hidden');
                        document.getElementById('content').classList.remove('ml-0');
                        document.getElementById('top-bar').classList.remove('hidden');
                        showDashboard();
                    } else {
                        await logout();
                    }
                }
            }

            checkSession();
        });
    </script>
</body>
</html>
